name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv version floor comes from tool.uv.required-version in
          # pyproject.toml; setup-uv resolves the latest release that
          # satisfies it.
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # mmcif and viennarna publish no cp315 wheels, so they are built from
      # source on Python 3.15 and need cmake.
      - name: Install cmake for source-built dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff format --check src/

      - name: Test with pytest
        run: uv run pytest

  build:
    name: build
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check prerequisite results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A prerequisite job failed."
            exit 1
          fi
