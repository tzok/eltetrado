name: Publish to PyPI

on:
  push:
    tags:
      - "*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # The uv version floor comes from tool.uv.required-version in
          # pyproject.toml; setup-uv resolves the latest release that
          # satisfies it.
          python-version: "3.13"
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Smoke test package
        run: |
          uv run --isolated --no-project --with ./dist/*.whl -- python -I -c "import eltetrado"
          uv run --isolated --no-project --with ./dist/*.tar.gz -- python -I -c "import eltetrado"

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
