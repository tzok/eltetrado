[project]
name = "eltetrado"
version = "1.12.0"
description = "Find and classify tetrads and quadruplexes in DNA/RNA 3D structure"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomasz Żok", email = "tomasz.zok@cs.put.poznan.pl" }]
keywords = ["bioinformatics", "rna", "dna", "quadruplex", "tetrad"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["mmcif", "numpy", "orjson", "rnapolis"]

[project.urls]
Homepage = "https://github.com/tzok/eltetrado"
Repository = "https://github.com/tzok/eltetrado"
Documentation = "https://github.com/tzok/eltetrado"

[project.scripts]
eltetrado = "eltetrado.cli:eltetrado_cli"
has_tetrad = "eltetrado.cli:has_tetrad_cli"
score-folds = "eltetrado.score_folds:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff.lint]
# Pins the rule families that are kept clean in this repository. Intentionally
# avoids the full "E"/"W" families (e.g. E501 line length) which the codebase
# does not target; CI still only runs `ruff format --check` and `pytest`.
select = [
    "B",     # flake8-bugbear
    "BLE",   # blind except
    "C4",    # flake8-comprehensions
    "E4",    # pycodestyle imports
    "E7",    # pycodestyle comparisons
    "E9",    # pycodestyle runtime errors
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "G",     # logging-format
    "I",     # isort
    "LOG",   # logging
    "PLW",   # pylint warnings
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
]

[tool.uv.build-backend]
source-exclude = ["*.helix", "example.fasta"]

[build-system]
requires = ["uv_build>=0.9.30,<0.14.0"]
build-backend = "uv_build"
