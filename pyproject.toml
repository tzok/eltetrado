[project]
name = "eltetrado"
version = "1.12.1"
description = "Find and classify tetrads and quadruplexes in DNA/RNA 3D structure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomasz Żok", email = "tomasz.zok@cs.put.poznan.pl" }]
keywords = ["bioinformatics", "rna", "dna", "quadruplex", "tetrad"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["mmcif", "numpy", "orjson", "rnapolis"]

[project.urls]
Homepage = "https://github.com/tzok/eltetrado"
Repository = "https://github.com/tzok/eltetrado"
Documentation = "https://github.com/tzok/eltetrado"

[project.scripts]
eltetrado = "eltetrado.cli:eltetrado_cli"
has_tetrad = "eltetrado.cli:has_tetrad_cli"
score-folds = "eltetrado.score_folds:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
# Lowest Python version the code must stay compatible with; also drives the
# pyupgrade (UP) and formatter targets. Keep in sync with `requires-python`.
target-version = "py311"

[tool.ruff.lint]
# Pins the rule families that are kept clean in this repository. Intentionally
# avoids the full "E"/"W" families (e.g. E501 line length) which the codebase
# does not target; CI still only runs `ruff format --check` and `pytest`.
select = [
    "B",     # flake8-bugbear
    "BLE",   # blind except
    "C4",    # flake8-comprehensions
    "E4",    # pycodestyle imports
    "E7",    # pycodestyle comparisons
    "E9",    # pycodestyle runtime errors
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "G",     # logging-format
    "I",     # isort
    "LOG",   # logging
    "PLW",   # pylint warnings
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
]

[tool.uv]
# Single source of truth for the uv version: astral-sh/setup-uv reads this
# when a workflow does not pass a version input, and uv itself refuses to run
# with an older release. Must be >= 0.13.0, the first release whose
# managed-Python index has a stable 3.15 (older uv resolves "3.15" to the
# pre-ABI-freeze alpha, which cannot load cp315 wheels). The floor must not
# exceed the uv version provided by the devenv shell.
required-version = ">=0.13.4"

[tool.uv.build-backend]
source-exclude = ["*.helix", "example.fasta"]

[build-system]
requires = ["uv_build>=0.9.30,<0.14.0"]
build-backend = "uv_build"
